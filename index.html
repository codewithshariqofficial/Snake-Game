<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <header>
            <h1 class="neon-text">SNAKE</h1>
            <div class="stats">
                <div class="stat-box">
                    <span class="label">SCORE</span>
                    <span id="score" class="value">000</span>
                </div>
                <div class="stat-box">
                    <span class="label">LEVEL</span>
                    <span id="level" class="value">01</span>
                </div>
                <div class="stat-box">
                    <span class="label">HIGH SCORE</span>
                    <span id="high-score" class="value">000</span>
                </div>
            </div>
            <div class="toolbar">
                <button id="pause-btn" class="icon-btn" title="Pause (P)">⏸</button>
                <button id="sound-btn" class="icon-btn" title="Toggle Sound">🔊</button>
            </div>
        </header>

        <div class="canvas-wrapper">
            <canvas id="gameCanvas"></canvas>

            <!-- Start Screen -->
            <div id="start-screen" class="overlay">
                <h2 class="neon-text">READY?</h2>
                <p>Use ARROWS or WASD to navigate</p>
                <div class="difficulty">
                    <span class="label">DIFFICULTY</span>
                    <div class="diff-buttons">
                        <button class="diff-btn" data-diff="easy">EASY</button>
                        <button class="diff-btn active" data-diff="normal">NORMAL</button>
                        <button class="diff-btn" data-diff="hard">HARD</button>
                    </div>
                </div>
                <button id="start-btn">BOOT UP</button>
            </div>

            <!-- Pause Screen -->
            <div id="pause-screen" class="overlay hidden">
                <h2 class="neon-text-alt">PAUSED</h2>
                <p>Press P or click Resume to continue</p>
                <button id="resume-btn">RESUME</button>
            </div>

            <!-- Game Over Screen -->
            <div id="game-over" class="overlay hidden">
                <h2 class="neon-text-alt">GAME OVER</h2>
                <p>FINAL SCORE: <span id="final-score">0</span></p>
                <button id="restart-btn">RESTART SYSTEM</button>
            </div>
        </div>

        <div class="power-up-indicator">
            <span id="active-power-up"></span>
        </div>

        <!-- Mobile Controls -->
        <div class="dpad" id="dpad">
            <button class="dpad-btn up" data-dir="up">▲</button>
            <div class="dpad-row">
                <button class="dpad-btn left" data-dir="left">◀</button>
                <button class="dpad-btn down" data-dir="down">▼</button>
                <button class="dpad-btn right" data-dir="right">▶</button>
            </div>
        </div>

        <footer>
            <p>&copy; 2026 CYBERPUNK SYSTEMS INC.</p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
